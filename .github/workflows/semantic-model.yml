name: Semantic model

on:
  push:
    paths:
      - "identity_model.py"
      - "semiroh/**"
      - "test_identity_model.py"
      - ".github/workflows/semantic-model.yml"
  pull_request:
    paths:
      - "identity_model.py"
      - "semiroh/**"
      - "test_identity_model.py"
      - ".github/workflows/semantic-model.yml"

jobs:
  semantic-model:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run semantic model tests
        run: python identity_model.py
